name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified package to NuGet
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-native:
    name: Build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, rid: linux-x64, binary: libseekstorm_ffi.so }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, binary: libseekstorm_ffi.so }
          - { os: macos-15, rid: osx-arm64, binary: libseekstorm_ffi.dylib }
          - { os: macos-15-intel, rid: osx-x64, binary: libseekstorm_ffi.dylib }
          - { os: windows-latest, rid: win-x64, binary: seekstorm_ffi.dll }
          - { os: windows-11-arm, rid: win-arm64, binary: seekstorm_ffi.dll }
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build Rust FFI
        run: cargo build --release --locked --manifest-path src/seekstorm-ffi/Cargo.toml
      - name: Stage runtime preserving RID and native directories
        shell: bash
        run: |
          mkdir -p runtimes/${{ matrix.rid }}/native
          cp src/seekstorm-ffi/target/release/${{ matrix.binary }} runtimes/${{ matrix.rid }}/native/
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build -c Release --warnaserror
      - name: Copy native binary for project-reference tests
        shell: bash
        run: |
          cp runtimes/${{ matrix.rid }}/native/${{ matrix.binary }} test/SeekStorm.SmokeTest/bin/Release/net10.0/
          cp runtimes/${{ matrix.rid }}/native/${{ matrix.binary }} tests/SeekStorm.Bindings.Tests/bin/Release/net10.0/
      - name: Run Release pipeline smoke test
        run: dotnet run --project test/SeekStorm.SmokeTest -c Release --no-build
      - name: Run all unit and native integration tests
        run: dotnet test -c Release --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: runtimes/
          if-no-files-found: error

  pack:
    runs-on: ubuntu-24.04
    needs: build-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: runtimes
          merge-multiple: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet pack src/SeekStorm.Bindings -c Release -o nupkgs --warnaserror
      - run: python3 scripts/verify-package.py nupkgs
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: nupkgs/*.nupkg
          if-no-files-found: error

  package-consumer:
    name: Package consumer (${{ matrix.rid }})
    needs: pack
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-15, rid: osx-arm64 }
          - { os: macos-15-intel, rid: osx-x64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: nupkgs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore actual package in isolated consumer
        run: dotnet restore test/SeekStorm.PackageSmokeTest -r ${{ matrix.rid }} --source ./nupkgs --source https://api.nuget.org/v3/index.json
      - name: Run package consumer without manual native copies
        run: dotnet run --project test/SeekStorm.PackageSmokeTest -c Release -r ${{ matrix.rid }} --no-restore
      - name: Publish NativeAOT consumer
        run: dotnet publish test/SeekStorm.PackageSmokeTest -c Release -r ${{ matrix.rid }} --no-restore --warnaserror -o package-consumer
      - name: Run NativeAOT consumer
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == Windows ]]; then
            ./package-consumer/SeekStorm.PackageSmokeTest.exe
          else
            ./package-consumer/SeekStorm.PackageSmokeTest
          fi

  publish:
    needs: package-consumer
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: nupkgs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: NuGet/login@v1
        id: login
        with:
          user: mostlylucid
      - run: dotnet nuget push nupkgs/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
